# --- IN-DEPTH ----------------------------------------------------------------

# VERIFIED, and a correction: p02nq0gn.rss is NOT BBC Minute. It is the BBC
# World Service Global News Podcast, ~30 min, twice daily on weekdays. This URL
# was live in your original config, just mislabelled. BBC Minute itself is dead.
[[feed.sources]]
name = "BBC Global News Podcast"
url = "https://podcasts.files.bbci.co.uk/p02nq0gn.rss"
lang = "en"
section = "in-depth"
enabled = true

# UNVERIFIED. WordPress-style URL; may be an article feed without enclosures.
# Radio Popolare is Milan-based and left-leaning, which fits.
[[feed.sources]]
name = "Radio Popolare - Notiziari"
url = "https://www.radiopopolare.it/feed/podcast/notiziari/"
lang = "it"
section = "in-depth"
enabled = false

