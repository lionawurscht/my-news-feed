name: Update RSS feeds

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      # --fail-on-error is deliberately NOT set: a single dead source should
      # not stop the other feeds from publishing. The report below is how you
      # find out something broke.
      - name: Build feeds
        run: python build_feed.py --verbose

      # Puts the per-source table on the run summary page, so you can see why
      # a source was excluded without opening the raw log.
      - name: Publish source report to job summary
        if: always()
        run: |
          {
            echo '## Source report'
            echo '| feed | section | source | status | entries | newest | added |'
            echo '|---|---|---|---|---|---|---|'
            python - <<'PY'
          import json
          for r in json.load(open("build_report.json")):
              newest = r["newest_age_hours"]
              newest = f"{newest:.1f}h" if isinstance(newest, (int, float)) else "-"
              print(f'| {r["feed_file"]} | {r["section"]} | {r["name"]} | '
                    f'{r["status"]} | {r["entries_seen"]} | {newest} | '
                    f'{r["episodes_added"]} |')
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update RSS feeds" && git push)
